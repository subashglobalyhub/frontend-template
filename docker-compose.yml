services:
  website-frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.local
    image: website-frontend:local
    container_name: website_frontend
    ports:
      - 80:80
      - 3000:3000
    env_file:
      - .env
    volumes:
      - .:/website/frontend
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/frontend.conf:/etc/nginx/conf.d/frontend.conf:ro
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
    #   interval: 15s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 90s
    networks:
      - iten
    command: >
      /bin/sh -c "
        service nginx start &&
        yarn install --frozen-lockfile &&
        yarn dev
      "

volumes:
  node_modules:

networks:
  iten:
