services:
  website-frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.local
    image: website-frontend:local
    container_name: website_frontend
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - .:/website/frontend
      - node_modules:/website/frontend/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - iten
    command: >
      /bin/sh -c "
        yarn install --frozen-lockfile &&
        yarn dev
      "

volumes:
  node_modules:

networks:
  iten:
    external: true
